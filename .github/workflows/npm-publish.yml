name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version to publish (for example, 2.0.0). Must match package.json "version".
        required: true
        type: string
      dry_run:
        description: Dry run (does not publish to npm or create a GitHub Release).
        default: true
        required: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.release_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Update npm for OIDC trusted publishing
        run: npm install --global npm@latest

      - name: Verify version matches package.json
        shell: bash
        run: |
          package_version="$(node -p 'require("./package.json").version')"

          if [[ "$RELEASE_TAG" != "$package_version" ]]; then
            echo "::error::Version mismatch: input version '$RELEASE_TAG' does not match package.json version '$package_version'" >&2
            exit 1
          fi

          echo "Version check passed: $package_version"
          echo "GITHUB_TAG=v$package_version" >> "$GITHUB_ENV"
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - id: package
        name: Read package metadata
        shell: bash
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          package_tag="$name@$version"

          if [[ "$version" == *"-"* ]]; then
            release_tag="${version#*-}"
            release_tag="${release_tag%%.*}"
          else
            release_tag="latest"
          fi

          {
            echo "name=$name"
            echo "version=$version"
            echo "package_tag=$package_tag"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

      - id: package-status
        name: Check package publication status
        shell: bash
        run: |
          stderr_file="$(mktemp)"
          trap 'rm -f "$stderr_file"' EXIT

          if pnpm view "$PACKAGE_TAG" version --registry https://registry.npmjs.org 2>"$stderr_file"; then
            echo "$PACKAGE_TAG is already published."
            echo "is_published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Eq "E404|404 Not Found|is not in this registry" "$stderr_file"; then
            echo "$PACKAGE_TAG is not published yet."
            echo "is_published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat "$stderr_file" >&2
          exit 1
        env:
          PACKAGE_TAG: ${{ steps.package.outputs.package_tag }}

      - name: Publish to npm (dry run)
        if: inputs.dry_run
        run: pnpm publish --dry-run --registry https://registry.npmjs.org --access public --tag "${{ steps.package.outputs.release_tag }}"

      - name: Publish to npm
        if: ${{ !inputs.dry_run && steps.package-status.outputs.is_published != 'true' }}
        run: pnpm publish --registry https://registry.npmjs.org --access public --tag "${{ steps.package.outputs.release_tag }}"

      - name: Create Git tag and GitHub Release
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          if gh release view "$GITHUB_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_TAG already exists."
            exit 0
          fi

          gh release create "$GITHUB_TAG" \
            --title "$GITHUB_TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
