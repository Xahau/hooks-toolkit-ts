name: Publish npm package and create release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v2.1.0 or 2.1.0). Must match package.json "version". Pre-release versions (e.g. 3.0.0-alpha.1) are published under the "next" dist-tag and marked as a GitHub pre-release.'
        required: true
        type: string
      dry_run:
        description: 'Dry run (does not publish to npm or create a GitHub release)'
        required: true
        type: boolean
        default: true

concurrency:
  group: npm-publish-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Update npm for OIDC trusted publishing
        run: npm install --global npm@latest

      - name: Verify version matches package.json
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          NORMALIZED_INPUT="${INPUT_VERSION#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [ "$NORMALIZED_INPUT" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: input version '${INPUT_VERSION}' does not match package.json version '${PKG_VERSION}'"
            exit 1
          fi

          echo "RELEASE_TAG=v${PKG_VERSION}" >> "$GITHUB_ENV"

          # Pre-release versions (e.g. 3.0.0-alpha.1) go to the "next" dist-tag
          # so "npm install @xahau/hooks-toolkit" keeps resolving to the stable release.
          if [[ "$PKG_VERSION" == *-* ]]; then
            echo "NPM_TAG=next" >> "$GITHUB_ENV"
            echo "GH_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "NPM_TAG=latest" >> "$GITHUB_ENV"
            echo "GH_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Publish to npm (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --tag "$NPM_TAG" --dry-run

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --tag "$NPM_TAG"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(--title "${RELEASE_TAG}" --generate-notes --target "${{ github.sha }}")
          if [ "$GH_PRERELEASE" = true ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" "${ARGS[@]}"
