# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: 'Setup jq'
        uses: dcarbone/install-jq-action@v1.0.1
        with:
          version: '${{ inputs.version }}'
          force: '${{ inputs.force }}'
      - name: 'Check jq'
        run: |
          which jq
          jq --version
      
      - name: Setup npm version 7
        run: |
          npm i -g npm@7 --registry=https://registry.npmjs.org

      - name: Cache node modules
        id: cache-nodemodules
        uses: actions/cache@v3
        env:
          cache-name: cache-node-modules
        with:
          # caching node_modules
          path: |
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-deps-${{ matrix.node-version }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-${{ matrix.node-version }}-
            ${{ runner.os }}-deps-
      
      - name: Install Dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: yarn install

      - run: yarn run format:ci
      - run: yarn run lint

  integration-c:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x, 26.x]

    env:
      HOOKS_COMPILE_HOST: http://localhost:9000

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Login to GHCR # to access ghcr.io/xahau/xrpl-hooks-compiler
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run xahaud container in background
        run: |
          docker run \
            --detach \
            --rm \
            --name rippled-service \
            -p 6006:6006 \
            --health-cmd="wget localhost:6006 || exit 1" \
            --health-interval=5s \
            --health-retries=10 \
            --health-timeout=2s \
            transia/xahaudjs:latest

      - name: Run hooks copiler container in background
        run: |
          docker run \
            --detach \
            --rm \
            --name compiler-api \
            -p 9000:9000 \
            --health-cmd="wget localhost:9000 || exit 1" \
            --health-interval=5s \
            --health-retries=10 \
            --health-timeout=2s \
            --env BUILD_RATE_MAX=0 \
            ghcr.io/xahau/xrpl-hooks-compiler:master

      - name: Setup npm version 7
        run: |
          npm i -g npm@7 --registry=https://registry.npmjs.org

      - name: Cache node modules
        id: cache-nodemodules
        uses: actions/cache@v3
        env:
          cache-name: cache-node-modules
        with:
          # caching node_modules
          path: |
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-deps-${{ matrix.node-version }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-${{ matrix.node-version }}-
            ${{ runner.os }}-deps-

      - name: Install Dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: yarn install

      - run: npm i -g @xahau/hooks-cli
      - run: yarn run build
      - run: hooks-cli compile-c contracts-c/toolbox build --headers contracts-c/utils/hook 
      - run: hooks-cli compile-c contracts-c/txns build --headers contracts-c/utils/hook 
      - run: yarn run test:integration-c
        env:
          XAHAU_ENV: standalone

      - name: Stop docker container
        if: always()
        run: docker stop rippled-service
