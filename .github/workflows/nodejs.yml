# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

env:
  XAHAUD_VERSION: 2026.6.21-release+3350

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 'Setup jq'
        uses: dcarbone/install-jq-action@v1.0.1
        with:
          version: '${{ inputs.version }}'
          force: '${{ inputs.force }}'
      - name: 'Check jq'
        run: |
          which jq
          jq --version
      
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm run format:ci
      - run: pnpm run lint

  download-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: cache binary
        id: cache-binary
        uses: actions/cache@v5
        with:
          path: xahaud
          key: ${{ runner.os }}-xahaud-${{ env.XAHAUD_VERSION }}

      - name: Download binary
        if: steps.cache-binary.outputs.cache-hit != 'true'
        run: |
          wget https://build.xahau.tech/${{ env.XAHAUD_VERSION }} -q -O xahaud
          chmod +x xahaud

  integration-c:
    runs-on: ubuntu-latest
    needs: download-binary
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x, 26.x]

    env:
      HOOKS_COMPILE_HOST: http://localhost:9000

    steps:
      - uses: actions/checkout@v6
      - name: Restore binary
        uses: actions/cache/restore@v5
        with:
          path: xahaud
          key: ${{ runner.os }}-xahaud-${{ env.XAHAUD_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Login to GHCR # to access ghcr.io/xahau/xrpl-hooks-compiler
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Generate genesis.json
        working-directory: .ci-config
        run: node genesis.js

      - name: Run docker in background
        run: |
          docker run --detach --rm \
            --name xahaud-service \
            -p 6006:6006 \
            --volume "${{ github.workspace }}/.ci-config/":"/opt/xahau/etc/" \
            --volume "${{ github.workspace }}/xahaud":"/opt/xahau/bin/xahaud" \
            --health-cmd="wget localhost:6006 || exit 1" \
            --health-interval=5s \
            --health-retries=10 \
            --health-timeout=2s \
            --env GITHUB_ACTIONS=true \
            --env CI=true \
            ubuntu:latest /opt/xahau/bin/xahaud -a --conf /opt/xahau/etc/xahaud.cfg --ledgerfile /opt/xahau/etc/genesis.json

      - name: Run hooks copiler container in background
        run: |
          docker run \
            --detach \
            --rm \
            --name compiler-api \
            -p 9000:9000 \
            --health-cmd="wget localhost:9000 || exit 1" \
            --health-interval=5s \
            --health-retries=10 \
            --health-timeout=2s \
            --env BUILD_RATE_MAX=0 \
            ghcr.io/xahau/xrpl-hooks-compiler:master

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm add --global @xahau/hooks-cli
      - run: pnpm run build
      - run: hooks-cli compile-c contracts-c/toolbox build --headers contracts-c/utils/hook 
      - run: hooks-cli compile-c contracts-c/txns build --headers contracts-c/utils/hook 
      - run: pnpm run test:integration-c
        env:
          XAHAU_ENV: standalone
          
      - name: Debug logs
        if: failure()
        # | grep -a 'TRC Hook'
        run: |
          docker logs xahaud-service --tail 100000  2>&1 
          docker logs compiler-api --tail 100000  2>&1 

      - name: Stop docker container
        if: always()
        run: |
            docker stop xahaud-service
            docker stop compiler-api
